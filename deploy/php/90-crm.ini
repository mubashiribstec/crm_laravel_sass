; CRM PHP settings (copied by deploy/install.sh to /etc/php/<version>/fpm/conf.d/90-crm.ini).
; CV uploads are validated up to 10 MB; PHP's defaults (2M / 8M) would refuse them.
upload_max_filesize = 12M
post_max_size = 16M
; Spreadsheet imports and exports.
memory_limit = 512M
max_execution_time = 300
expose_php = Off
