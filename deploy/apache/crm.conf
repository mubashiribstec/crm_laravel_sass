# CRM virtual host (written by deploy/install.sh from deploy/apache/crm.conf).
# PHP runs in PHP-FPM; public/.htaccess has the rewrite rules and refuses the private upload
# folders, so AllowOverride must stay on.
<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot __APP_DIR__/public

    <Directory __APP_DIR__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Only index.php runs as PHP: a script that ends up in public/uploads is never executed.
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
        SetHandler "proxy:unix:/run/php/php__PHP_VERSION__-fpm.sock|fcgi://localhost"
    </Files>

    # CV uploads are up to 10 MB (PHP: deploy/php/90-crm.ini).
    LimitRequestBody 20971520

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/crm-error.log
    CustomLog ${APACHE_LOG_DIR}/crm-access.log combined
</VirtualHost>
