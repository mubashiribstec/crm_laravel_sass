services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/crm
    environment:
      # The DB lives in the mysql container on the laravel network, not on
      # 127.0.0.1 (inside this container 127.0.0.1 is itself). Overrides .env.
      DB_HOST: mysql
      # This machine's address on your LAN: the CRM is reached at http://10.44.1.24:8000.
      APP_URL: http://10.44.1.24:8000
      # Must match MYSQL_ROOT_PASSWORD below (testing only — change it for real use).
      DB_PASSWORD: Agf24G6IyxXTad8o6gn8
    volumes:
      - ./:/var/www/crm
    # PHP-FPM (9000) is reached by nginx over the "laravel" network only. Publishing it let
    # anyone on the LAN talk FastCGI to PHP directly, which can run arbitrary code.
    networks:
      - laravel
    # Xplogent on another machine needs nothing here: set XPLOGENT_BASE_URL to its LAN
    # address in .env. Xplogent on this same server: XPLOGENT_BASE_URL=http://host.docker.internal:8765
    # (127.0.0.1 inside this container is the container itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/crm
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Agf24G6IyxXTad8o6gn8
      MYSQL_DATABASE: crm_kbp           # ✅ Optional: auto-create this DB
    ports:
      - "127.0.0.1:3306:3306"   # this machine only; never publish MySQL to the network
    volumes:
      - mysql_data:/var/lib/mysql
    # On the app's network, so the app reaches it as DB_HOST=mysql (port 3306 is no longer
    # published to the LAN, so the app can't go through the host's address).
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
