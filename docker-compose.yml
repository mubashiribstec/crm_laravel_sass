services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/crm
    environment:
      # The DB lives in the mariadb container on the laravel network, not on
      # 127.0.0.1 (inside this container 127.0.0.1 is itself). Overrides .env.
      # Everything else (APP_URL, DB_PASSWORD, XPLOGENT_*) comes from .env, which is
      # mounted with the code. Never put passwords in this file: it is in git.
      DB_HOST: mariadb
    volumes:
      - ./:/var/www/crm
    depends_on:
      mariadb:
        condition: service_healthy
    # PHP-FPM (9000) is reached by nginx over the "laravel" network only. Publishing it let
    # anyone on the LAN talk FastCGI to PHP directly, which can run arbitrary code.
    networks:
      - laravel
    # Xplogent on another machine needs nothing here: set XPLOGENT_BASE_URL to its LAN
    # address in .env. Xplogent on this same server: XPLOGENT_BASE_URL=http://host.docker.internal:8765
    # (127.0.0.1 inside this container is the container itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/crm
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  # MariaDB, as in production (11.8 is the current long-term-support release; CI tests on 11.x).
  mariadb:
    image: mariadb:11.8
    container_name: laravel-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_DATABASE:-crm_kbp}   # created on the first start
    ports:
      - "127.0.0.1:3306:3306"   # this machine only; never publish the database to the network
    volumes:
      # Its own volume: MariaDB can't open the old MySQL 8 data files (mysql_data).
      # Moving existing data across: SETUP.md, "Moving from the old MySQL container".
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    # On the app's network, so the app reaches it as DB_HOST=mariadb (port 3306 is not
    # published to the LAN). The alias keeps an older .env with DB_HOST=mysql working.
    networks:
      laravel:
        aliases:
          - mysql

  # Database admin UI, off by default: `docker compose --profile tools up -d phpmyadmin`.
  # It logs in to MariaDB with the root password, so it listens on this machine only.
  # From your PC: ssh -L 8080:127.0.0.1:8080 <user>@<this server>, then open
  # http://127.0.0.1:8080. Stop it when done: `docker compose stop phpmyadmin`.
  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["tools"]
    container_name: laravel-phpmyadmin
    restart: unless-stopped
    environment:
      # Talks to the mariadb container by name over the laravel network.
      PMA_HOST: mariadb
      PMA_PORT: 3306
      # Lets phpMyAdmin import larger SQL files.
      UPLOAD_LIMIT: 300M
    ports:
      - "127.0.0.1:8080:80"     # never publish a DB admin tool to the network
    depends_on:
      - mariadb
    networks:
      - laravel

volumes:
  mariadb_data:

networks:
  laravel:
    driver: bridge
