# Nginx in front of the CRM's PHP-FPM container (service "app", port 9000).
# The app code is bind-mounted at /var/www/crm, so nginx reads the public files
# from the same mount and passes PHP to the app container over the laravel network.
server {
    listen 80;
    server_name _;
    root /var/www/crm/public;
    index index.php;

    # Laravel: serve static files, else hand the request to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny direct access to hidden files (.env, .git, ...).
    location ~ /\. {
        deny all;
    }
}
