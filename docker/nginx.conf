# Nginx in front of the CRM's PHP-FPM container (service "app", port 9000).
# The app code is bind-mounted at /var/www/crm, so nginx reads the public files
# from the same mount and passes PHP to the app container over the laravel network.
server {
    listen 80;
    server_name _;
    root /var/www/crm/public;
    index index.php;

    # CV uploads are validated up to 10 MB (nginx's default limit is 1 MB).
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Laravel: serve static files, else hand the request to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only Laravel's front controller runs PHP. Any other .php file under public/
    # (for example something uploaded) is never executed.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ \.php$ {
        return 404;
    }

    # Uploaded files are data, never code.
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar|pl|py|cgi|sh|html?|svg)$ {
            deny all;
        }
    }

    # Deny direct access to hidden files (.env, .git, ...).
    location ~ /\. {
        deny all;
    }
}
